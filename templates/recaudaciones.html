<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recaudaciones - Gestión Municipal</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="{{ url_for('static', filename='styles/dashboard.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/recaudaciones.css') }}">
</head>
<body class="bg-light">

<div class="container py-4">
    <div class="topbar">
        <div class="page-title">
            <h1>Módulo de Recaudaciones</h1>
            <p>Sistema Integral de Gestión Municipal</p>
        </div>
        <div class="d-flex gap-2">
            <a href="{{ url_for('home') }}" class="btn btn-outline-secondary">
                <i class="bi bi-arrow-left me-1"></i>Panel Principal
            </a>
            <button type="button" class="btn btn-success" data-bs-toggle="modal" data-bs-target="#recaudacionesModal">
                <i class="bi bi-cash-coin me-1"></i>Abrir Recaudaciones
            </button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% include 'modals/recaudaciones_modal.html' %}

<script>
    document.addEventListener("DOMContentLoaded", () => {
        const modalEl = document.getElementById("recaudacionesModal");
        if (modalEl) {
            const modal = new bootstrap.Modal(modalEl);
            modal.show();
        }
    });
</script>
</body>
</html>
